<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <meta name="description" content="Contact informationabout the company and a contact form for feedback.">
  <meta name="author" content="Leticia Santana">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">
  <header>
    <img src="images/rafting_logo.jpg" alt="Rafting Logo" width="200">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    
    <h1>White Water Rafting Company</h1>
      
    <p>R. Elmo Ribeiro do Val, 90 - Enseada do Suá, Vitória</p>
    <p>+55 27 98803-3608</p>
    <p>lsantana3@byupathway.edu</p>
    <section class="contact-container">
      <h2>Talk with us!</h2>
      <div class="map">
          <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3741.875846824388!2d-40.293171700628264!3d-20.305405444957483!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1780701610194!5m2!1spt-BR!2sbr width="400" height="350" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        
      </div>
      
      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label>Message Purpose:</label>
        <div class="radio-group">
          <label>
            <input type="radio" id="general" name="purpose">
            General Inquiry
          </label>

          <label>
            <input type="radio" id="reservation" name="purpose">
            Reservation Question
          </label>
          <label>
            <input type="radio" id="suggestion" name="purpose">
            Website Suggestion
          </label>
        </div>

        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>

        <div class="checkbox-group">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please Subscribe me to the monthyly newsletter</label>
          
        </div>

        <button type="submit">Get in Touch!</button>
        
      </form>
    </section>
      
    <section class="adventures">
      <h3>We Are Here to Serve You!</h3>
      <div class="adventure-gallery">
        <figure>
          <img src="images/leticia_small.jpg" alt="Leticia Vieira" width="200">
          <figcaption>Leticia Vieira</figcaption>
        </figure>

        <figure>
          <img src="images/alex_small.jpg" alt="Alex Vieira ">
          <figcaption>Alex Vieira</figcaption>
        </figure>

        <figure>
          <img src="images/aria_small.jpg" alt="Aria Santana">
          <figcaption>Aria Santana</figcaption>
        </figure>

      </div>

    </section>
  </main>
  <footer>
    <p>&copy;2026 &#10070; Wite Water Rafting &#10070; Leticia Santana</p>
    <nav class="socialmidia">
      <a href="https://facebook.com">
        <img src="images/logo_face.png" alt="Facebook Icon" width="50">
      </a>
      <a href="https://linkedin.com">
        <img src="images/logo_linkedin.png" alt="Linkedin Icon" width="50">
      </a>
      <a href="https://instagram.com">
        <img src="images/logo_insta.png" alt="Instagram Icon" width="50">
      </a>
    </nav>
  </footer>
</body>

</html>
